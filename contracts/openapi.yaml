openapi: 3.1.0
info:
  title: Радар вузов API
  description: '

    CRM контроля взаимодействия ИТ Школы Ростелекома с вузами.


    Все методы `/api/v1` требуют `Authorization: Bearer <access_token>` из Keycloak.

    Ошибки возвращаются в формате `application/problem+json` с полем `code`

    из каталога в ARCHITECTURE.md.

    '
  version: 0.1.0
paths:
  /api/health:
    get:
      tags:
      - system
      summary: Состояние сервиса и базы данных
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
        '500':
          description: INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me:
    get:
      tags:
      - catalogs
      summary: Профиль текущего пользователя
      operationId: read_me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/universities:
    get:
      tags:
      - catalogs
      summary: Вузы со счётчиками взаимодействий и открытых сигналов
      operationId: read_universities_api_v1_universities_get
      security:
      - HTTPBearer: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Название или регион
          title: Search
        description: Название или регион
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Номер страницы, с 1
          default: 1
          title: Page
        description: Номер страницы, с 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Размер страницы
          default: 50
          title: Page Size
        description: Размер страницы
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_UniversityOut_'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/universities/{university_id}:
    get:
      tags:
      - catalogs
      summary: Вуз
      operationId: read_university_api_v1_universities__university_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: university_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: University Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/directions:
    get:
      tags:
      - catalogs
      summary: ИТ-направления
      operationId: read_directions_api_v1_directions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DirectionRef'
                type: array
                title: Response Read Directions Api V1 Directions Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/programs:
    get:
      tags:
      - catalogs
      summary: ИТ-программы
      operationId: read_programs_api_v1_programs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: direction_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: ИТ-направление
          title: Direction Id
        description: ИТ-направление
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramRef'
                title: Response Read Programs Api V1 Programs Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/products:
    get:
      tags:
      - catalogs
      summary: ИТ-продукты
      operationId: read_products_api_v1_products_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductRef'
                type: array
                title: Response Read Products Api V1 Products Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/users:
    get:
      tags:
      - catalogs
      summary: Пользователи для фильтра «ответственный»
      operationId: read_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response Read Users Api V1 Users Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/workflows/default:
    get:
      tags:
      - workflow
      summary: Опубликованная версия базового workflow
      operationId: read_default_workflow_api_v1_workflows_default_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/workflows/default/norms:
    get:
      tags:
      - workflow
      summary: Нормы этапов с подсказками по истории
      operationId: read_norms_api_v1_workflows_default_norms_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StageNormOut'
                type: array
                title: Response Read Norms Api V1 Workflows Default Norms Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/workflows/default/norms/{stage_code}:
    put:
      tags:
      - workflow
      summary: Задать норму этапа вручную
      operationId: put_norm_api_v1_workflows_default_norms__stage_code__put
      security:
      - HTTPBearer: []
      parameters:
      - name: stage_code
        in: path
        required: true
        schema:
          type: string
          title: Stage Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNormOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: AUTH_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/workflows/default/norms/{stage_code}/accept-suggestion:
    post:
      tags:
      - workflow
      summary: Принять подсказку нормы
      description: Нормой становится 80-й перцентиль завершённых этапов.
      operationId: post_accept_suggestion_api_v1_workflows_default_norms__stage_code__accept_suggestion_post
      security:
      - HTTPBearer: []
      parameters:
      - name: stage_code
        in: path
        required: true
        schema:
          type: string
          title: Stage Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNormOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: AUTH_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/interactions:
    get:
      tags:
      - interactions
      summary: Взаимодействия с фильтрами
      operationId: read_interactions_api_v1_interactions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Номер страницы, с 1
          default: 1
          title: Page
        description: Номер страницы, с 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Размер страницы
          default: 50
          title: Page Size
        description: Размер страницы
      - name: university_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Вуз
          title: University Id
        description: Вуз
      - name: direction_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: ИТ-направление
          title: Direction Id
        description: ИТ-направление
      - name: program_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: ИТ-программа
          title: Program Id
        description: ИТ-программа
      - name: product_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: ИТ-продукт
          title: Product Id
        description: ИТ-продукт
      - name: owner_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: КАМ
          title: Owner Id
        description: КАМ
      - name: stage_code
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Код текущего этапа
          title: Stage Code
        description: Код текущего этапа
      - name: has_signal
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Есть открытый сигнал
          title: Has Signal
        description: Есть открытый сигнал
      - name: period_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Начало периода, UTC
          title: Period From
        description: Начало периода, UTC
      - name: period_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Конец периода, UTC
          title: Period To
        description: Конец периода, UTC
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Вуз, программа или продукт
          title: Search
        description: Вуз, программа или продукт
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_InteractionListItem_'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/interactions/{interaction_id}:
    get:
      tags:
      - interactions
      summary: Карточка взаимодействия
      description: История, допустимые переходы с требованиями и открытые сигналы.
      operationId: read_interaction_api_v1_interactions__interaction_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: interaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Interaction Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionDetail'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/interactions/{interaction_id}/transitions:
    post:
      tags:
      - interactions
      summary: Перевести взаимодействие на другой этап
      operationId: post_transition_api_v1_interactions__interaction_id__transitions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: interaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Interaction Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResult'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR · WF_COMMENT_REQUIRED · WF_ATTACHMENT_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: INTERACTION_VERSION_CONFLICT · WF_TRANSITION_NOT_ALLOWED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/interactions/bulk-transitions:
    post:
      tags:
      - interactions
      summary: Перевести несколько взаимодействий на один этап
      description: Разрешён только с этапов с `bulk_allowed`. У каждой записи свой итог, поэтому частичный
        успех — обычный ответ. Переход с требованием документа выполняется в карточке.
      operationId: post_bulk_transitions_api_v1_interactions_bulk_transitions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTransitionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/interactions/{interaction_id}/owner:
    put:
      tags:
      - interactions
      summary: Сменить ответственного КАМа
      description: Доступно руководителю в пределах команды и администратору.
      operationId: put_owner_api_v1_interactions__interaction_id__owner_put
      security:
      - HTTPBearer: []
      parameters:
      - name: interaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Interaction Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerChange'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionDetail'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: AUTH_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: INTERACTION_VERSION_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/interactions/bulk-owner:
    post:
      tags:
      - interactions
      summary: Передать несколько взаимодействий другому КАМу
      description: Итог по каждой записи; недоступные записи возвращают `NOT_FOUND`.
      operationId: post_bulk_owner_api_v1_interactions_bulk_owner_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOwnerRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: AUTH_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/interactions/{interaction_id}/attachments:
    post:
      tags:
      - attachments
      summary: Загрузить документ к взаимодействию
      description: Файл проверяется по расширению и сигнатуре, лимит задаёт `MAX_UPLOAD_MB`. Документ
        привязывается к текущему этапу и закрывает сигнал «нет документа».
      operationId: post_attachment_api_v1_interactions__interaction_id__attachments_post
      security:
      - HTTPBearer: []
      parameters:
      - name: interaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Interaction Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_post_attachment_api_v1_interactions__interaction_id__attachments_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: FILE_TYPE_NOT_ALLOWED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: FILE_TOO_LARGE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags:
      - attachments
      summary: Документы взаимодействия
      operationId: read_attachments_api_v1_interactions__interaction_id__attachments_get
      security:
      - HTTPBearer: []
      parameters:
      - name: interaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Interaction Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentOut'
                title: Response Read Attachments Api V1 Interactions  Interaction Id  Attachments Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/attachments/{attachment_id}/file:
    get:
      tags:
