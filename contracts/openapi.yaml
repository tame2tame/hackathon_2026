openapi: 3.1.0
info:
  title: Радар вузов API
  description: '

    CRM контроля взаимодействия ИТ Школы Ростелекома с вузами.


    Все методы `/api/v1` требуют `Authorization: Bearer <access_token>` из Keycloak.

    Ошибки возвращаются в формате `application/problem+json` с полем `code`

    из каталога в ARCHITECTURE.md.

    '
  version: 0.1.0
paths:
  /api/health:
    get:
      tags:
      - system
      summary: Состояние сервиса, базы данных и хранилища файлов
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
        '500':
          description: INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me:
    get:
      tags:
      - catalogs
      summary: Профиль текущего пользователя
      operationId: read_me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/universities:
    get:
      tags:
      - catalogs
      summary: Вузы со счётчиками взаимодействий и открытых сигналов
      operationId: read_universities_api_v1_universities_get
      security:
      - HTTPBearer: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Название или регион
          title: Search
        description: Название или регион
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Номер страницы, с 1
          default: 1
          title: Page
        description: Номер страницы, с 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Размер страницы
          default: 50
          title: Page Size
        description: Размер страницы
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_UniversityOut_'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/universities/{university_id}:
    get:
      tags:
      - catalogs
      summary: Вуз
      operationId: read_university_api_v1_universities__university_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: university_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: University Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/counterparty-groups:
    get:
      tags:
      - catalogs
      summary: Группы контрагентов
      description: Вузы (B2B), частные лица (B2C) и группы, которые завёл администратор.
      operationId: read_groups_api_v1_counterparty_groups_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CounterpartyGroupOut'
                type: array
                title: Response Read Groups Api V1 Counterparty Groups Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '304':
          description: С прошлого запроса ничего не изменилось
      security:
      - HTTPBearer: []
  /api/v1/directions:
    get:
      tags:
      - catalogs
      summary: ИТ-направления
      operationId: read_directions_api_v1_directions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DirectionRef'
                type: array
                title: Response Read Directions Api V1 Directions Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '304':
          description: С прошлого запроса ничего не изменилось
      security:
      - HTTPBearer: []
  /api/v1/programs:
    get:
      tags:
      - catalogs
      summary: ИТ-программы
      operationId: read_programs_api_v1_programs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: direction_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: ИТ-направление
          title: Direction Id
        description: ИТ-направление
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramRef'
                title: Response Read Programs Api V1 Programs Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '304':
          description: С прошлого запроса ничего не изменилось
  /api/v1/programs/{program_id}/priority:
    put:
      tags:
      - catalogs
      summary: Задать приоритет курса вручную
      description: 'Рейтинг востребованности считается по данным LMS и сайта, но порядок продвижения можно
        задать руками: приоритет показывается в справочнике и в рейтинге. Меняют руководитель и администратор,
        изменение пишется в аудит.'
      operationId: put_program_priority_api_v1_programs__program_id__priority_put
      security:
      - HTTPBearer: []
      parameters:
      - name: program_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Program Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramRef'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: AUTH_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/products:
    get:
      tags:
      - catalogs
      summary: ИТ-продукты
      operationId: read_products_api_v1_products_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductRef'
                type: array
                title: Response Read Products Api V1 Products Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '304':
          description: С прошлого запроса ничего не изменилось
      security:
      - HTTPBearer: []
  /api/v1/users:
    get:
      tags:
      - catalogs
      summary: Пользователи для фильтра «ответственный»
      operationId: read_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response Read Users Api V1 Users Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/clients:
    get:
      tags:
      - clients
      summary: 'Клиенты: физические и юридические лица'
      description: Организации видны всем. Людей видит тот, кто их завёл, владельцы их записей и руководитель
        команды. Email и телефон в списке не показываются.
      operationId: read_clients_api_v1_clients_get
      security:
      - HTTPBearer: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Имя, название или ИНН
          title: Search
        description: Имя, название или ИНН
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - person
            - organization
            type: string
          - type: 'null'
          description: Человек или организация
          title: Kind
        description: Человек или организация
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Номер страницы, с 1
          default: 1
          title: Page
        description: Номер страницы, с 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Размер страницы
          default: 50
          title: Page Size
        description: Размер страницы
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ClientListItem_'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - clients
      summary: Добавить клиента
      description: Email и телефон шифруются перед записью в базу; ИНН — только у организации.
      operationId: post_client_api_v1_clients_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/clients/{client_id}:
    get:
      tags:
      - clients
      summary: Карточка клиента
      description: 'Просмотр карточки человека пишется в аудит: это обращение к персональным данным.'
      operationId: read_client_api_v1_clients__client_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Client Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/workflows/default:
    get:
      tags:
      - workflow
      summary: Опубликованная версия базового workflow
      operationId: read_default_workflow_api_v1_workflows_default_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/workflows/default/norms:
    get:
      tags:
      - workflow
      summary: Нормы этапов с подсказками по истории
      operationId: read_norms_api_v1_workflows_default_norms_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StageNormOut'
                type: array
                title: Response Read Norms Api V1 Workflows Default Norms Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/workflows/default/norms/{stage_code}:
    put:
      tags:
      - workflow
      summary: Задать норму этапа вручную
      operationId: put_norm_api_v1_workflows_default_norms__stage_code__put
      security:
      - HTTPBearer: []
      parameters:
      - name: stage_code
        in: path
        required: true
        schema:
          type: string
          title: Stage Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNormOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: AUTH_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/workflows/default/norms/{stage_code}/accept-suggestion:
    post:
      tags:
      - workflow
      summary: Принять подсказку нормы
      description: Нормой становится 80-й перцентиль завершённых этапов.
      operationId: post_accept_suggestion_api_v1_workflows_default_norms__stage_code__accept_suggestion_post
      security:
      - HTTPBearer: []
      parameters:
      - name: stage_code
        in: path
        required: true
        schema:
          type: string
          title: Stage Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNormOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: AUTH_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/workflows:
    get:
      tags:
      - workflow
      summary: Процессы и группы, которые по ним работают
      description: У каждой группы контрагентов свой процесс; черновик изменений виден, если начат.
      operationId: read_workflows_api_v1_workflows_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WorkflowSummaryOut'
                type: array
                title: Response Read Workflows Api V1 Workflows Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
    post:
      tags:
      - workflow
      summary: Создать шаблон процесса
      operationId: post_template_api_v1_workflows_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTemplateCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: AUTH_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - HTTPBearer: []
  /api/v1/workflows/{template_id}:
    get:
      tags:
      - workflow
      summary: Действующая схема процесса
      operationId: read_workflow_api_v1_workflows__template_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/workflows/{template_id}/norms:
    get:
      tags:
      - workflow
      summary: Нормы этапов процесса с подсказками по истории
      operationId: read_template_norms_api_v1_workflows__template_id__norms_get
      security:
      - HTTPBearer: []
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StageNormOut'
                title: Response Read Template Norms Api V1 Workflows  Template Id  Norms Get
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/workflows/{template_id}/norms/{stage_code}:
    put:
      tags:
      - workflow
      summary: Задать норму этапа процесса вручную
      operationId: put_template_norm_api_v1_workflows__template_id__norms__stage_code__put
      security:
      - HTTPBearer: []
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Template Id
      - name: stage_code
        in: path
        required: true
        schema:
          type: string
          title: Stage Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNormOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: AUTH_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/workflows/{template_id}/norms/{stage_code}/accept-suggestion:
    post:
      tags:
      - workflow
      summary: Принять подсказку нормы этапа процесса
      operationId: post_template_accept_suggestion_api_v1_workflows__template_id__norms__stage_code__accept_suggestion_post
      security:
      - HTTPBearer: []
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Template Id
      - name: stage_code
        in: path
        required: true
        schema:
          type: string
          title: Stage Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNormOut'
        '401':
          description: AUTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
