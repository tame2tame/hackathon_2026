      - name: actor_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Кто сделал
          title: Actor User Id
        description: Кто сделал
      - name: occurred_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Не раньше, ISO 8601
          title: Occurred From
