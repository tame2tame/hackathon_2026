      - name: occurred_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Раньше, ISO 8601
          title: Occurred To
        description: Раньше, ISO 8601
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
