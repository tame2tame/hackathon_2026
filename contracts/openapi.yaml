components:
  schemas:
    AccessRuleCreate:
      properties:
        subject_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Subject User Id
        subject_role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
        effect:
          type: string
          enum:
          - allow
          - deny
          title: Effect
        scope_kind:
          type: string
          enum:
          - university
          - direction
          - program
          - group
          title: Scope Kind
        scope_id:
          type: string
          format: uuid
          title: Scope Id
        comment:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Comment
      type: object
      required:
      - effect
      - scope_kind
      - scope_id
      title: AccessRuleCreate
      description: Правило адресуется либо сотруднику, либо роли — ровно одно из двух.
    AccessRuleOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        subject_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Subject User Id
        subject_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Role
        effect:
          type: string
          title: Effect
        scope_kind:
          type: string
          title: Scope Kind
        scope_id:
          type: string
          format: uuid
          title: Scope Id
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
      type: object
      required:
      - id
      - subject_user_id
      - subject_role
      - effect
      - scope_kind
      - scope_id
      - comment
      title: AccessRuleOut
    AddressOut:
      properties:
        channel_kind:
          type: string
          enum:
          - telegram
          - max
          - email
          title: Channel Kind
        channel_name:
          type: string
          title: Channel Name
        channel_enabled:
          type: boolean
          title: Channel Enabled
          description: Включил ли канал администратор
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
          description: Чат Telegram, пользователь Max или email
        is_enabled:
          type: boolean
          title: Is Enabled
      type: object
      required:
      - channel_kind
      - channel_name
      - channel_enabled
      - address
      - is_enabled
      title: AddressOut
    AddressUpdate:
      properties:
        address:
          type: string
          maxLength: 254
          minLength: 1
          title: Address
        is_enabled:
          type: boolean
          title: Is Enabled
          default: true
      type: object
      required:
      - address
      title: AddressUpdate
    AdminUserOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          type: string
          title: Email
        full_name:
          type: string
          title: Full Name
        role:
          $ref: '#/components/schemas/Role'
        team_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Team Id
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - id
      - email
      - full_name
      - role
      - team_id
      - is_active
      title: AdminUserOut
    AdminUserUpdate:
      properties:
        role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
        team_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Team Id
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
          description: Отключённый сотрудник не входит
      type: object
      title: AdminUserUpdate
    AllowedTransitionOut:
      properties:
