name: Deploy
# Деплой только вручную: стенд общий, и решение о выкатке принимает человек.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Загрузить демо-данные v1 после миграций
        type: boolean
        default: false

# Workflow только читает репозиторий: на сервер он ходит по SSH-ключу из секретов.
permissions:
  contents: read

concurrency:
  group: deploy-stand
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stand
    steps:
      - name: Ключ доступа
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Обновление кода и сборка
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -euo pipefail <<'REMOTE'
            cd /srv/radar/hackathon_2026
            git fetch --all
            git checkout "${{ github.ref_name }}"
            git pull --ff-only
            cd infra
            docker compose -f docker-compose.prod.yml --env-file .env build
          REMOTE

      # Дамп до миграций: если новая миграция испортит данные, есть к чему вернуться.
      - name: Копия базы перед миграциями
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -euo pipefail <<'REMOTE'
            cd /srv/radar/hackathon_2026/infra
            if docker compose -f docker-compose.prod.yml --env-file .env ps --status running -q postgres | grep -q .; then
              docker compose -f docker-compose.prod.yml --env-file .env run --rm backup sh /scripts/backup.sh
            else
              echo "База ещё не запущена — первый запуск, копировать нечего"
            fi
          REMOTE

      # Миграции под владельцем схемы; API и воркер работают ролью radar_app без прав на DDL.
      - name: Миграции и запуск
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -euo pipefail <<'REMOTE'
            cd /srv/radar/hackathon_2026/infra
            docker compose -f docker-compose.prod.yml --env-file .env up -d postgres redis minio
            docker compose -f docker-compose.prod.yml --env-file .env run --rm migrate
            # Перезапуск сбрасывает кэш темы; healthy подтверждает применение к существующему realm.
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps --force-recreate --wait --wait-timeout 300 keycloak
            docker compose -f docker-compose.prod.yml --env-file .env up -d
          REMOTE

      - name: Демо-данные
        if: ${{ inputs.seed }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -euo pipefail <<'REMOTE'
            cd /srv/radar/hackathon_2026/infra
            docker compose -f docker-compose.prod.yml --env-file .env run --rm api python -m scripts.seed --full
          REMOTE

      - name: Проверка стенда
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -euo pipefail <<'REMOTE'
            cd /srv/radar/hackathon_2026
            sh infra/smoke.sh "${{ secrets.PUBLIC_URL }}"
          REMOTE
