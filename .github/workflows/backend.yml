name: Backend
on:
  push:
    paths: ['backend/**', 'contracts/**', 'docs/USER_GUIDE.md', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'contracts/**', 'docs/USER_GUIDE.md', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://radar:radar@127.0.0.1:5432/radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Шрифт с кириллицей нужен отчётам в PDF.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fonts-dejavu-core
      # Те же версии, что в образе: lock-файл ограничивает всё, что в нём есть.
      - run: pip install -c requirements.lock -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app scripts
      - name: Миграции — одна голова Alembic
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Контракт совпадает со схемой приложения
        run: python -m scripts.export_openapi --check
      - name: Руководство совпадает со встроенной справкой
        run: python -m scripts.export_help --check
      - name: Тесты — миграции вниз и вверх, API, правила радара, схема как в моделях
        run: pytest
      - name: Миграции на данных — alembic check и откат последних пяти на полном стенде
        env:
          DATABASE_URL: postgresql+asyncpg://radar:radar@127.0.0.1:5432/radar_test
        run: |
          export PD_ENCRYPTION_KEY="$(python -c 'from app.core.crypto import generate_key; print(generate_key())')"
          alembic upgrade head
          alembic check
          python -m scripts.seed --full
          alembic downgrade -5
          alembic upgrade head
          alembic check
      - name: Перечень библиотек
        run: |
          pip freeze --exclude-editable > ../docs/dependencies.txt
          echo "Библиотек: $(wc -l < ../docs/dependencies.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: dependencies
          path: docs/dependencies.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа API
        run: docker build backend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна gitleaks: секрет мог попасть в давний коммит.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Известные уязвимости в зависимостях
        run: |
          pip install pip-audit
          # Проверяем ровно те версии, что ставятся в образ.
          pip-audit --strict --desc -r backend/requirements.lock --disable-pip --no-deps
      - name: Секреты в истории
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --verbose --exit-code 1
