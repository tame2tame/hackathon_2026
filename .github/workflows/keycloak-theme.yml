name: Keycloak theme
on:
  push:
    paths: ['infra/keycloak/**', 'infra/docker-compose*.yml', '.github/workflows/keycloak-theme.yml']
  pull_request:
    paths: ['infra/keycloak/**', 'infra/docker-compose*.yml', '.github/workflows/keycloak-theme.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Подключение темы и локализация
        run: python -m unittest discover -s infra/keycloak/tests
