# Профиль стенда. Значений по умолчанию нет намеренно: `${VAR:?}` не даст запустить
# окружение с забытым паролем. Все переменные — в .env рядом с этим файлом (см. env.prod.example).
# Запуск: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Образы закреплены по digest: тег можно перезаписать, а стенд должен подниматься тем же, что
# проверяли. Тег оставлен для читаемости; обновление — новый digest в этом файле.
name: radar-vuzov-prod

services:
  web:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR:?путь к сертификатам}:/etc/nginx/certs:ro
      - ${SPA_DIR:?путь к собранному фронтенду}:/usr/share/nginx/html:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - api
      - keycloak
    restart: unless-stopped

  # Миграции: одноразовый запуск под владельцем схемы до старта API и воркера.
  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://radar:${POSTGRES_PASSWORD:?пароль базы}@postgres:5432/radar
      PD_ENCRYPTION_KEY: ${PD_ENCRYPTION_KEY:?ключ шифрования контактов}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ../backend
    environment:
      APP_ENV: production
      AUTH_MODE: keycloak
      DATABASE_URL: postgresql+asyncpg://radar_app:${APP_DB_PASSWORD:?пароль роли приложения}@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
      # Издатель токена — внешний адрес, ключи забираются по внутреннему.
      KEYCLOAK_ISSUER: ${PUBLIC_URL:?адрес стенда}/auth/realms/radar-vuzov
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/radar-vuzov/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: radar-api
      CORS_ORIGINS: ${PUBLIC_URL:?адрес стенда}
      PD_ENCRYPTION_KEY: ${PD_ENCRYPTION_KEY:?ключ шифрования контактов}
      STORAGE_BACKEND: s3
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?логин MinIO}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?пароль MinIO}
      S3_BUCKET: radar-vuzov
      LOG_LEVEL: INFO
      PUBLIC_URL: ${PUBLIC_URL:?адрес стенда}
      # Внешние системы на стенде — заглушки из того же образа; настоящие адреса задаются здесь.
      LMS_BASE_URL: http://mock-lms:8100
      SITE_BASE_URL: http://mock-site:8101
      TELEGRAM_API_URL: http://mock-messengers:8102
      MAX_API_URL: http://mock-messengers:8102
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ../backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      APP_ENV: production
      AUTH_MODE: keycloak
      DATABASE_URL: postgresql+asyncpg://radar_app:${APP_DB_PASSWORD:?пароль роли приложения}@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
      PD_ENCRYPTION_KEY: ${PD_ENCRYPTION_KEY:?ключ шифрования контактов}
      STORAGE_BACKEND: s3
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?логин MinIO}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?пароль MinIO}
      S3_BUCKET: radar-vuzov
      PUBLIC_URL: ${PUBLIC_URL:?адрес стенда}
      LMS_BASE_URL: http://mock-lms:8100
      SITE_BASE_URL: http://mock-site:8101
      TELEGRAM_API_URL: http://mock-messengers:8102
      MAX_API_URL: http://mock-messengers:8102
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Файлы вложений и отчётов. Отдельное хранилище от базы, как советует жюри; наружу не публикуется.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?логин MinIO}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?пароль MinIO}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Заглушки LMS, сайта и мессенджеров и почтовый сервер для писем: наружу не публикуются.
  # Посмотреть полученное можно через SSH-туннель (см. docs/DEPLOY.md).
  mock-lms:
    build: ../backend
    command: ["uvicorn", "mocks.lms:app", "--host", "0.0.0.0", "--port", "8100"]
    restart: unless-stopped

  mock-site:
    build: ../backend
    command: ["uvicorn", "mocks.site:app", "--host", "0.0.0.0", "--port", "8101"]
    restart: unless-stopped

  mock-messengers:
    build: ../backend
    command: ["uvicorn", "mocks.messengers:app", "--host", "0.0.0.0", "--port", "8102"]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    command: ["start", "--import-realm", "--http-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?логин администратора Keycloak}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?пароль администратора Keycloak}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?пароль базы Keycloak}
      KC_HOSTNAME: ${PUBLIC_URL:?адрес стенда}/auth
      # Адрес интерфейса подставляется в разрешённые адреса возврата клиента radar-web.
      RADAR_WEB_URL: ${PUBLIC_URL:?адрес стенда}
      # Пароли демо-входов стенда: локальные значения из realm на стенд не попадают.
      DEMO_KAM_PASSWORD: ${DEMO_KAM_PASSWORD:?пароль демо-КАМа}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:?пароль демо-руководителя}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?пароль демо-администратора}
      # За nginx: Keycloak должен верить заголовкам X-Forwarded-*.
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-radar-vuzov.json:/opt/keycloak/data/import/realm-radar-vuzov.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?пароль базы}
      # Читает скрипт ролей при создании тома: роль приложения и отдельная база Keycloak.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?пароль роли приложения}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?пароль базы Keycloak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Файлы копируются отдельно от базы: тем же образом MinIO, в котором есть mc.
  backup-files:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: ["sh", "-c", "while true; do sh /scripts/files.sh || echo 'копия файлов не удалась'; sleep 86400; done"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: radar-vuzov
      BACKUP_ROOT: /backups
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?логин MinIO}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?пароль MinIO}
      # Внешнее хранилище для зашифрованных копий; пусто — копии остаются только на сервере.
      OFFSITE_URL: ${OFFSITE_URL:-}
      OFFSITE_BUCKET: ${OFFSITE_BUCKET:-}
      OFFSITE_ACCESS_KEY: ${OFFSITE_ACCESS_KEY:-}
      OFFSITE_SECRET_KEY: ${OFFSITE_SECRET_KEY:-}
    volumes:
      - ./backup:/scripts:ro
      - backups:/backups
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      PGHOST: postgres
      PGUSER: radar
      PGPASSWORD: ${POSTGRES_PASSWORD:?пароль базы}
      BACKUP_DATABASES: radar keycloak
      BACKUP_DIR: /backups
      KEEP_DAYS: "14"
      # Открытый ключ для шифрования внешних копий; закрытый хранится вне сервера.
      BACKUP_GPG_PUBLIC_KEY: ${BACKUP_GPG_PUBLIC_KEY:-}
    volumes:
      - ./backup:/scripts:ro
      - ./backup-keys:/keys:ro
      - backups:/backups
    command: ["sh", "-c", "while true; do sh /scripts/backup.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  backups:
  certbot-www:
