# nginx стенда: отдаёт SPA, проксирует API и Keycloak, ставит заголовки безопасности.
# Сертификаты кладутся в /etc/nginx/certs (в compose — том с сертификатами Let's Encrypt).

# Версию nginx наружу не показываем.
server_tokens off;

server {
    listen 80;
    server_name _;
    # Всё, кроме проверки сертификата, уходит на TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Только наборы с прямой секретностью (профиль Mozilla intermediate).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Заголовки безопасности: браузер не должен догадываться о типах, открывать нас во фрейме
    # или отдавать полный адрес страницы наружу.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    # Предел вложения — 25 МБ (ТЗ), проверяет его API и отвечает понятной ошибкой
    # FILE_TOO_LARGE. nginx пропускает чуть больше: запас на оболочку multipart.
    client_max_body_size 27m;

    # Встроенный DNS Docker и адреса через переменные: nginx не падает при старте,
    # если API или Keycloak ещё поднимаются, и переживает их перезапуск.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_backend "api:8000";
    set $keycloak_backend "keycloak:8080";

    location /api/v1/events {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Поток событий не буферизуем и не закрываем по таймауту чтения.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Swagger UI грузит свои скрипты и стили с jsdelivr и запускает встроенный скрипт:
    # общая CSP его блокирует, поэтому у этой страницы своя, чуть шире. add_header внутри
    # location заменяет заголовки сервера целиком, так что остальные повторены.
    location = /api/docs {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'" always;
    }

    # Консоль администратора Keycloak и realm master наружу не открываем: управлять
    # Keycloak на стенде можно только через SSH-туннель на порт контейнера.
    location /auth/admin/ {
        return 404;
    }
    location /auth/realms/master/ {
        return 404;
    }

    location /auth/ {
        # Keycloak работает от корня, а снаружи живёт под /auth: префикс срезаем здесь,
        # а KC_HOSTNAME=<адрес>/auth сообщает Keycloak, какой адрес писать в ссылки и токены.
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://$keycloak_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keycloak сам ставит HSTS, nosniff, X-Frame-Options и CSP под свои служебные iframe
        # (проверка сессии в keycloak-js). Наши заголовки сервера здесь дублировали бы и ломали
        # их, а любой add_header в этом блоке отключает наследование — поэтому здесь только он.
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
