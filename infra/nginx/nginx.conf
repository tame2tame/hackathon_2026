# nginx стенда: отдаёт SPA, проксирует API и Keycloak, ставит заголовки безопасности.
# Сертификаты кладутся в /etc/nginx/certs (в compose — том с сертификатами Let's Encrypt).

server {
    listen 80;
    server_name _;
    # Всё, кроме проверки сертификата, уходит на TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Заголовки безопасности: браузер не должен догадываться о типах, открывать нас во фрейме
    # или отдавать полный адрес страницы наружу.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 25m;  # предел загрузки вложений из ТЗ

    # Встроенный DNS Docker и адреса через переменные: nginx не падает при старте,
    # если API или Keycloak ещё поднимаются, и переживает их перезапуск.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_backend "api:8000";
    set $keycloak_backend "keycloak:8080";

    location /api/v1/events {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Поток событий не буферизуем и не закрываем по таймауту чтения.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /auth/ {
        # С переменной в proxy_pass префикс не срезается сам, поэтому убираем его явно.
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://$keycloak_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
