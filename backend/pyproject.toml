[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-vuzov-backend"
version = "0.1.0"
description = "API «Радар вузов»: CRM контроля взаимодействия ИТ Школы Ростелекома с вузами"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.141",
    "uvicorn[standard]~=0.53",
    "pydantic~=2.13",
    "pydantic-settings~=2.15",
    "sqlalchemy[asyncio]~=2.0.53",
    "asyncpg~=0.31",
    "alembic~=1.20",
    "pyjwt[crypto]~=2.14",
    "pyyaml~=6.0",
]

[project.optional-dependencies]
dev = [
    "httpx~=0.28",
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "ruff~=0.16",
    "mypy~=2.3",
    "types-pyyaml~=6.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
# Кириллица в строках, комментариях и докстрингах — осознанно: интерфейс и документация на русском.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
